name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 앞의 것을 취소한다 — 뒤엣것이 어차피 덮어쓴다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🔴 게이트는 **이미 있었다.** 테스트 75개·eslint·tsc 가 저장소에 있는데
  #    CI 가 없어서 아무도 안 돌렸다. "게이트가 없다"와 "게이트를 안 돌린다"는 다른 문제고,
  #    여기 있던 건 뒤쪽이었다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx vitest run
      # `build` 가 `tsc -b` 를 포함하므로 타입검사는 여기서 같이 돈다.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  # 🔴 **학생이 여는 주소는 여기다** — `chromafall.pages.dev`.
  #
  #    교육청 네트워크가 `github.io` 를 도메인째 막아 2026-08-21 에 Cloudflare Pages 로
  #    옮겼는데, 이 저장소엔 워크플로 자체가 없어 배포가 **100% 수동**이었다
  #    (`wrangler pages project list` → Git Provider: No).
  #    형제 앱(gugu-guardians)에서 정확히 같은 구조 때문에 **CI 초록불을 받은 변경이
  #    학생에게 도달하지 않은** 사고가 실제로 났다(2026-08-22). 그 전에 막는다.
  #
  #    ⚠️ `package.json` 의 `deploy: gh-pages -d dist` 는 **옛 경로**다. 남겨 두되 쓰지 말 것.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 시크릿 확인
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 조용히 실패하지 않는다 — 시크릿이 없으면 **왜 안 나갔는지**를 로그에 남긴다.
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN·CLOUDFLARE_ACCOUNT_ID 가 없어 학생 사이트(chromafall.pages.dev) 배포를 건너뜁니다 — 그동안은 손으로 'npx wrangler pages deploy dist --project-name chromafall --branch main' 를 쳐야 합니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cloudflare Pages 배포 (학생이 여는 주소)
        if: steps.gate.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name chromafall --branch main
