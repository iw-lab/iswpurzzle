# 딱1 로켓 CI — 시험·봇 게이트·빌드만 돈다. 배포는 tools/deploy.sh(naver 계정 Pages · 손으로) — 저장소에 Cloudflare 비밀을 두지 않는다.
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npx vitest run
      - run: node --test tests/school-hub.nodetest.mjs
      - run: npx tsc -p tsconfig.app.json
      - run: npx vite build
